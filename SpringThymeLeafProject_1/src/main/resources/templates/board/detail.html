<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
 <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<style type="text/css">
.container {
	margin-top: 50px;
}
.row {
	margin: 0px auto;
	width: 900px;
}
h3 {
	text-align: center;
}
</style>

</head>
<body>
	<div class="container">
		<div class="row">
			<h3>내용 보기</h3>
			<table class="table">
				<tr>
					<th width="20%" class="text-center success">번호</th>
					<td width="30%" class="text-center">[[${vo.no}]]</td>
					<th width="20%" class="text-center success">작성일</th>
					<td width="30%" class="text-center">[[${vo.regdate}]]</td>	
				</tr>
				<tr>
					<th width="20%" class="text-center success">작성자</th>
					<td width="30%" class="text-center">[[${vo.name}]]</td>
					<th width="20%" class="text-center success">조회수</th>
					<td width="30%" class="text-center">[[${vo.hit}]]</td>	
				</tr>
				<tr>
					<th width="20%" class="text-center success">제목</th>
					<td colspan="3" class="text-center">[[${vo.subject}]]</td>	
				</tr>
				<tr>
					<td colspan="4" valign="top" class="text-left" height="200px">
						<pre style="white-space: pre-wrap; border: none; background: white;">[[${vo.content}]]</pre>
					</td>
				</tr>
				<tr>
					<td colspan="4" class="text-right">
						<a th:href="@{/board/update(no=${vo.no})}" class="btn btn-xs btn-warning">수정</a>
						<a th:href="@{/board/delete(no=${vo.no})}" class="btn btn-xs btn-warning">삭제</a>
						<a href="/board/list" class="btn btn-xs btn-warning">목록</a>
					</td>
				</tr>
			</table>
		</div>
	</div>
</body>
</html>
